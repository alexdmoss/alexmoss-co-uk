log_format main '{'
	'"time":"$time_iso8601",'
	'"wMethod":"$request_method",'
	'"wResource":"$request_uri",'
	'"wStatus":"$status",'
	'"wDurationSeconds":$request_time,'
	'"wSize":$body_bytes_sent,'
	'"wSrcIP":"$remote_addr",'
	'"wFwdFor":"$http_x_forwarded_for",'
	'"wFwdProto":"$http_x_forwarded_proto",'
	'"wHostHdr":"$http_host",'
	'"wRedirectLocation":"$sent_http_location",'
	'"wReferer":"$http_referer",'
	'"wUserAgent":"$http_user_agent"}';

# health checks (ours and Google's load balancer) would drown out real traffic
map "$request_uri:$http_user_agent" $loggable {
  ~^/health   0;
  ~GoogleHC   0;
  default     1;
}

access_log /dev/stdout main if=$loggable;

server {
  listen 8080 default;
  server_name alexmoss.co.uk;

  root /app;
  index index.html;

  # relative redirects, so nginx never puts its own :8080 port in a Location header
  absolute_redirect off;

  # the "via google 1.1 header" turns off default compression. Switch back on!
  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # race timeout to avoid race condition with GCP's load balancers
  keepalive_timeout 650;
  keepalive_requests 10000;

  error_page 404 /404.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "OK";
  }

  # old site paths, kept from the Caddy config
  location ^~ /contact {
    return 301 /#contact;
  }

  location ~ ^/(about|bio|gallery|books|index\.php) {
    return 301 /;
  }

}
